name: package-source
on:
  push:
    branches: [main]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          rm -rf .git
          zip -qr comercio-popular-backend.zip . -x "node_modules/*" "dist/*" "build/*"
      - uses: actions/upload-artifact@v4
        with:
          name: comercio-popular-backend-source
          path: comercio-popular-backend.zip
